name: LLM review adapter tests (no model keys)
on:
  pull_request:
permissions:
  contents: read
jobs:
  model-adapter-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic provider failure and retry contract tests
        run: python -B -m unittest discover -s tests -p test_review_pipeline.py -v
      - name: Trust boundary
        run: echo 'MOCK_PROVIDER_ONLY NO_EXTERNAL_LLM NO_SECRETS NO_APP_CHECK GATE_A_BLOCKED'
