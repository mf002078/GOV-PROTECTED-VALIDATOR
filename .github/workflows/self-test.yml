name: Validator self-tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Owned synthetic positive and negative cases
        run: python -B -m unittest discover -s tests -v
      - name: Trust boundary
        run: echo "Candidate source never executed as authoritative validator; not Gate A."
