name: Bounded review diff contract (offline)
on:
  pull_request:
permissions:
  contents: read
jobs:
  llm-diff-boundary-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline boundary and negative cases
        run: python -B -m unittest discover -s tests -p test_llm_diff_boundary.py -v
      - name: Trust boundary
        run: echo 'NO_MODEL_CALLED NO_APP_KEY NOT_ATTESTED GATE_A_BLOCKED'
