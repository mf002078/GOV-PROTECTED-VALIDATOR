name: Responses API transport contract (fake HTTP only)
on:
  pull_request:
permissions:
  contents: read
jobs:
  responses-transport-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deterministic transport negative tests
        run: python -B -m unittest discover -s tests -p test_openai_responses_transport.py -v
      - name: Scope boundary
        run: echo 'FAKE_HTTP_ONLY NO_EXTERNAL_MODEL_API NO_SECRETS NOT_ATTESTED GATE_A_BLOCKED'
